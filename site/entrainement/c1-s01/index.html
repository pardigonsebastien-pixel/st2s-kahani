<script>window.SEANCE = {"id": "C1-S01", "route": "/entrainement/c1-s01", "navigation": {"chapter": "C1", "label": "Chapitre 1 — Séance 1"}, "exercises": [{"id": "EX-01", "title": "Indicateur, constat, hypothèse ou jugement ?", "type": "choix_unique", "instruction": "Pour chaque formulation, choisis son statut. Lis ensuite le feedback, y compris lorsque ta réponse est à reprendre.", "student": {"items": [{"id": "EX-01-1", "prompt": "« 27 % des lycéens interrogés déclarent ressentir souvent de la solitude. »", "options": [{"id": "A", "text": "Indicateur"}, {"id": "B", "text": "Constat", "feedbackWrong": "Ce n’est pas encore un constat : la phrase donne directement une donnée chiffrée mesurée par l’enquête."}, {"id": "C", "text": "Hypothèse", "feedbackWrong": "Une hypothèse cherche une explication possible. Ici, aucune explication n’est proposée."}, {"id": "D", "text": "Jugement", "feedbackWrong": "La phrase ne donne pas un avis : elle rapporte un résultat chiffré de l’enquête."}], "answers": ["A"], "feedbackCorrect": "C’est une donnée chiffrée issue de l’enquête : un indicateur.", "feedbackRetry": "Repars de la nature de la phrase : décrit-elle une donnée, un résultat formulé, une explication possible ou un avis ?"}, {"id": "EX-01-2", "prompt": "« Une partie des lycéens interrogés présente des fragilités concernant le bien-être. »", "options": [{"id": "A", "text": "Indicateur", "feedbackWrong": "Un indicateur est une donnée mesurable, souvent chiffrée. Ici, la phrase reformule plusieurs résultats."}, {"id": "B", "text": "Constat"}, {"id": "C", "text": "Hypothèse", "feedbackWrong": "La phrase ne cherche pas à expliquer les fragilités : elle décrit prudemment la situation observée."}, {"id": "D", "text": "Jugement", "feedbackWrong": "Il n’y a pas d’avis personnel. La formulation est prudente et s’appuie sur les résultats de l’enquête."}], "answers": ["B"], "feedbackCorrect": "La phrase reformule prudemment plusieurs indicateurs : c’est un constat.", "feedbackRetry": "Vérifie si la phrase décrit ce que montrent les données ou si elle cherche à l’expliquer."}, {"id": "EX-01-3", "prompt": "« Les difficultés relationnelles peuvent contribuer au mal-être de certains jeunes. »", "options": [{"id": "A", "text": "Indicateur", "feedbackWrong": "Aucune donnée chiffrée ou mesurable n’est donnée dans cette phrase."}, {"id": "B", "text": "Constat", "feedbackWrong": "Le constat décrit un résultat observé. Ici, le mot “peuvent” propose une explication à vérifier."}, {"id": "C", "text": "Hypothèse"}, {"id": "D", "text": "Jugement", "feedbackWrong": "La phrase n’exprime pas un avis. Elle avance une explication possible, formulée avec prudence."}], "answers": ["C"], "feedbackCorrect": "Le mot “peuvent” montre qu’il s’agit d’une explication possible, à vérifier avec des données adaptées : une hypothèse.", "feedbackRetry": "Repère la formulation prudente : la phrase avance-t-elle une explication certaine ou possible ?"}, {"id": "EX-01-4", "prompt": "« Les adultes ne s’occupent pas assez des adolescents. »", "options": [{"id": "A", "text": "Indicateur", "feedbackWrong": "Aucune donnée mesurable ne permet ici d’établir cette affirmation."}, {"id": "B", "text": "Constat", "feedbackWrong": "Un constat devrait préciser les données, la population, le territoire et la période. Cette phrase ne le fait pas."}, {"id": "C", "text": "Hypothèse", "feedbackWrong": "Une hypothèse proposerait une explication possible à vérifier. Ici, la phrase porte une appréciation."}, {"id": "D", "text": "Jugement"}], "answers": ["D"], "feedbackCorrect": "C’est une appréciation générale, qui n’est appuyée sur aucune donnée : un jugement.", "feedbackRetry": "Demande-toi si la phrase peut être vérifiée telle quelle à partir d’une enquête ou si elle exprime un avis."}]}, "feedbackCorrect": "Tu distingues les quatre statuts de formulation.", "feedbackRetry": "Relis le feedback de la réponse choisie, puis recommence."}, {"id": "EX-02", "title": "Construire une démarche de diagnostic", "type": "ordre", "instruction": "Remets les cinq étapes dans l’ordre. Après vérification, chaque étape mal placée est expliquée.", "student": {"items": [{"id": "A", "text": "Recueillir des données sur une population, dans un territoire et à une période donnés.", "feedbackWrong": "Cette étape ouvre la démarche : avant toute analyse, il faut disposer d’informations situées."}, {"id": "B", "text": "Construire des indicateurs à partir de ces données.", "feedbackWrong": "Les indicateurs sont construits après le recueil des données et avant la formulation du constat."}, {"id": "C", "text": "Formuler un constat précis et nuancé.", "feedbackWrong": "Le constat vient après les indicateurs : il reformule ce qu’ils permettent d’observer."}, {"id": "D", "text": "Proposer une hypothèse pour comprendre la situation.", "feedbackWrong": "L’hypothèse intervient après le constat : elle tente d’expliquer une situation déjà caractérisée."}, {"id": "E", "text": "Rechercher les informations nécessaires pour vérifier cette hypothèse.", "feedbackWrong": "La vérification vient après la formulation de l’hypothèse : on cherche alors les données qui permettraient de l’étayer ou de la discuter."}]}, "grading": {"expected": ["A", "B", "C", "D", "E"]}, "feedbackCorrect": "La démarche part de données situées, construit des indicateurs, formule un constat, puis propose et vérifie une hypothèse.", "feedbackRetry": "La démarche ne commence pas par l’explication : elle part d’abord des données et des indicateurs."}]};</script>
