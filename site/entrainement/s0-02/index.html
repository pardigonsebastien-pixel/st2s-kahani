<script>window.SEANCE = {"id": "C0-S02", "route": "/entrainement/s0-02", "navigation": {"chapter": "C0", "label": "Séance 2 — CE 2 h"}, "exercises": [{"id": "EX-01", "title": "Quelle étape du Diagnostic ?", "type": "choix_unique", "instruction": "pour chaque énoncé, choisis l’étape du Diagnostic correspondante", "student": {"items": [{"id": "EX-01-1", "prompt": "« L'isolement et la précarité peuvent rendre nécessaire un accompagnement adapté. »", "options": [{"id": "A", "text": "Situation problématique — caractériser."}, {"id": "B", "text": "Déterminants — identifier les facteurs qui influencent ou contribuent."}, {"id": "C", "text": "Conséquences, besoins et enjeux — identifier les conséquences et dégager les besoins et les enjeux."}], "answers": ["C"], "feedbackCorrect": "La phrase porte sur les effets et sur ce qui rend une réponse nécessaire", "feedbackRetry": "Distingue le constat initial, les facteurs qui l'éclairent et les conséquences ou besoins qui rendent une réponse nécessaire"}, {"id": "EX-01-2", "prompt": "« Plus d'un jeune sur deux sorti de l'ASE n'est ni en études, ni en emploi, ni en formation. »", "options": [{"id": "A", "text": "Situation problématique — caractériser."}, {"id": "B", "text": "Déterminants — identifier les facteurs qui influencent ou contribuent."}, {"id": "C", "text": "Conséquences, besoins et enjeux — identifier les conséquences et dégager les besoins et les enjeux."}], "answers": ["A"], "feedbackCorrect": "C'est un constat sur une population", "feedbackRetry": "Cette donnée décrit d'abord la situation observée ; elle n'explique pas encore les facteurs ni les besoins"}, {"id": "EX-01-3", "prompt": "« Les parcours scolaires, les ressources relationnelles et le cumul de difficultés doivent être mis en relation. »", "options": [{"id": "A", "text": "Situation problématique — caractériser."}, {"id": "B", "text": "Déterminants — identifier les facteurs qui influencent ou contribuent."}, {"id": "C", "text": "Conséquences, besoins et enjeux — identifier les conséquences et dégager les besoins et les enjeux."}], "answers": ["B"], "feedbackCorrect": "On éclaire la situation sans affirmer une cause unique", "feedbackRetry": "Ici, il faut mettre plusieurs facteurs en relation avec prudence, sans réduire la situation à une seule cause"}]}}, {"id": "EX-02", "title": "Compléter un diagnostic", "type": "ordre", "instruction": "remets les trois propositions dans l’ordre du Diagnostic", "student": {"items": [{"id": "A", "text": "Les parcours scolaires, les difficultés sociales et les ressources relationnelles sont des éléments à mettre en relation avec prudence."}, {"id": "B", "text": "L'enjeu est de limiter les ruptures de parcours et de favoriser l'égalité des chances."}, {"id": "C", "text": "Les études citées montrent qu'une partie des jeunes sortant de l'ASE connaît des difficultés de poursuite d'études, d'insertion ou de logement."}]}, "grading": {"expected": ["C", "A", "B"]}, "feedbackCorrect": "Le diagnostic part des constats sur la situation, met ensuite plusieurs facteurs en relation, puis dégage les besoins et les enjeux", "feedbackRetry": "Commence par caractériser la situation, puis identifie ce qui l'influence ou y contribue, avant de dégager les conséquences, les besoins et les enjeux"}, {"id": "EX-03", "title": "Préparer une réponse de type bac", "type": "reponse_bac_plan", "instruction": "prépare les idées essentielles avant de rédiger une réponse à la question : « Montrez que les informations recueillies dans un diagnostic permettent de mieux comprendre les besoins des jeunes sortant de l'ASE. »", "student": {"guides": [{"title": "Repère 1 — Comprendre la question", "options": [{"id": "A", "text": "Décrire séparément les documents."}, {"id": "B", "text": "Expliquer, à partir des informations du diagnostic, comment elles permettent de comprendre les besoins des jeunes."}, {"id": "C", "text": "Proposer directement une action publique."}], "answers": ["B"], "feedbackCorrect": "« Montrez » demande ent attendu : partir des constats, les expliquer avec prudence, puis faire apparaître les besoins", "feedbackRetry": "Repars de la question : il ne faut ni seulement décrire les documents, ni proposer directement une action. Il faut montrer comment les informations du diagnostic permettent de comprendre les besoins"}]};</script>
