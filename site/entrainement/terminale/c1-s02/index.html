<script>window.SEANCE = {"id": "C1-S02", "niveau": "terminale", "route": "/entrainement/terminale/c1-s02", "navigation": {"chapter": "C1", "label": "Caractériser un problème de santé sur un territoire"}, "exercises": [{"id": "EX-01", "title": "Formuler un constat rigoureux", "type": "choix_unique", "instruction": "Pour chaque situation, choisis la formulation qui constitue un constat rigoureux", "student": {"items": [{"id": "EX-01-I01", "prompt": "À partir du document 1, quelle formulation est rigoureuse ?", "options": [{"id": "A", "text": "Les jeunes à Mayotte vont mal."}, {"id": "B", "text": "En 2019, 49 % des habitants de 15 à 24 ans à Mayotte sont en situation d'EDM."}, {"id": "C", "text": "Les difficultés de santé mentale à Mayotte sont causées par le manque de psychologues."}], "answers": ["B"], "feedbackCorrect": "La formulation indique la population, le territoire, la période et l'indicateur ; elle décrit un constat", "feedbackRetry": "Un constat doit être précis. Une donnée seule ne permet pas d'affirmer qu'elle explique ou provoque une situation"}, {"id": "EX-01-I02", "prompt": "À partir du document 2, quelle formulation décrit correctement un élément de contexte territorial ?", "options": [{"id": "A", "text": "En 2023, Mayotte compte 23 psychologues pour 100 000 habitants, contre 108 en métropole."}, {"id": "B", "text": "Tous les jeunes de Mayotte ne peuvent pas consulter un psychologue."}, {"id": "C", "text": "En 2019, les 15-24 ans de Mayotte ont consulté moins souvent parce qu'il n'y avait pas assez de lits."}], "answers": ["A"], "feedbackCorrect": "Cette formulation précise la période, le territoire, l'indicateur et la comparaison autorisée par le document", "feedbackRetry": "Ne généralise pas à tous les individus et n'ajoute pas une cause que les données ne démontrent pas"}]}}, {"id": "EX-02", "title": "Associer chaque donnée à son périmètre", "type": "association", "instruction": "Associe chaque donnée au bon périmètre d'étude", "student": {"items": [{"id": "A", "prompt": "49 % sont en situation d'EDM."}, {"id": "B", "prompt": "23 psychologues pour 100 000 habitants."}, {"id": "C", "prompt": "10 lits sont disponibles pour la psychiatrie."}], "planCards": [{"id": "1", "text": "Habitants de 15 à 24 ans à Mayotte en 2019."}, {"id": "2", "text": "Ensemble de la population de Mayotte en 2023."}, {"id": "3", "text": "Offre de psychiatrie à Mayotte en 2021."}]}, "grading": {"expected": ["A→1", "B→2", "C→3"]}, "feedbackCorrect": "Tu as bien distingué les populations, les périodes et la nature des indicateurs", "feedbackRetry": "Reprends, pour chaque donnée, la population ou l'offre étudiée ainsi que l'année indiquée dans le dossier"}, {"id": "EX-03", "title": "Vérifier une comparaison", "type": "choix_multiple", "instruction": "Choisis toutes les affirmations justes à propos des comparaisons entre les documents", "student": {"items": [{"id": "EX-03-I01", "prompt": "Les affirmations justes sont :", "options": [{"id": "A", "text": "Les 49 % de jeunes de 15 à 24 ans en situation d'EDM à Mayotte peuvent être comparés aux 39 % de jeunes métropolitains cités dans le document 1."}, {"id": "B", "text": "Les 23 psychologues pour 100 000 habitants en 2023 décrivent directement la situation des seuls 15-24 ans en 2019."}, {"id": "C", "text": "Les données de 2019 sur les 15-24 ans et celles de 2021 ou 2023 sur l'offre de soins apportent des informations différentes qui doivent être distinguées."}, {"id": "D", "text": "La densité de psychologues en 2023 prouve à elle seule la cause de la situation observée chez les jeunes en 2019."}], "answers": ["A", "C"], "feedbackCorrect": "Une comparaison exige de contrôler le périmètre des données ; une donnée de contexte ne prouve pas une cause", "feedbackRetry": "Vérifie toujours la population, le territoire, la période et ce que mesure chaque indicateur avant de comparer ou d'expliquer"}]}}]};</script>
